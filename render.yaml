services:
- type: web
  name: intelligent-hospital-assistant
  runtime: python
  buildCommand: pip install -r requirements.txt
  startCommand: streamlit run frontend/src/Home.py --server.address 0.0.0.0 --server.port
    $PORT
  envVars:
  - key: DATABASE_URL
    fromDatabase:
      name: hospital-db
      property: connectionString
  - key: GROQ_API_KEY
    sync: false
  - key: GROQ_MODEL
    value: openai/gpt-oss-120b
  - key: STAFF_USERNAME
    value: admin
  - key: STAFF_PASSWORD
    sync: false
  region: singapore
  plan: free
databases:
- name: hospital-db
  plan: free
  region: singapore
  databaseName: hospital
  user: hospital_app

[project]
name = "agents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Intelligent Hospital Assistant" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "faiss-cpu>=1.15.0",
    "joblib>=1.5.3",
    "langchain>=1.3.14",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.3",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.4.1",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.10",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "pymupdf>=1.28.0",
    "python-dotenv>=1.2.2",
    "scikit-learn==1.6.1",
    "seaborn>=0.13.2",
    "sentence-transformers>=5.6.1",
    "streamlit>=1.61.1",
    "torchvision>=0.28.0",
    "xgboost>=3.3.0",
]

[project.scripts]
agents = "agents:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
